name: Generate GitSkins Space Shooter

on:
  push:
    paths:
      - README.md
      - .github/workflows/gitskins-space-shooter.yml

  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

concurrency:
  group: gitskins-space-shooter
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Prepare output
        run: mkdir -p dist

      - name: Generate Space Shooter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check "gh-space-shooter==2.0.4"
          gh-space-shooter euandr --output dist/space-shooter.gif --strategy random --fps 30

      - name: Publish generated game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin output

          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp -f dist/space-shooter.gif space-shooter.gif

          git add space-shooter.gif

          if git diff --cached --quiet; then
            echo "GIF did not change; nothing to commit."
          else
            git commit -m "Update GitSkins Space Shooter"
            git push origin output
          fi
